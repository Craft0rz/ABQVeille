<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>ABQ Veille Scientifique</title>
    <!--[if mso]>
    <style type="text/css">
        body, table, td {font-family: Arial, sans-serif !important;}
    </style>
    <![endif]-->
    <style type="text/css">
        /* Reset styles */
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }
        img {
            border: 0;
            height: auto;
            line-height: 100%;
            outline: none;
            text-decoration: none;
            -ms-interpolation-mode: bicubic;
        }
        table {
            border-collapse: collapse;
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
        }

        /* Email container */
        .email-container {
            max-width: 600px;
            margin: 0 auto;
        }

        /* ABQ branding colors - Website-matched palette */
        .bg-primary { background-color: #6B8E23; }      /* ABQ Olive Green */
        .bg-secondary { background-color: #0072BC; }    /* ABQ Blue */
        .bg-accent { background-color: #D4DFC8; }       /* Light green tint */
        .bg-light { background-color: #F7F9F4; }        /* Very light green tint */
        .bg-white { background-color: #ffffff; }

        .text-primary { color: #6B8E23; }
        .text-secondary { color: #0072BC; }
        .text-accent { color: #5A7C1A; }
        .text-white { color: #ffffff; }
        .text-muted { color: #777777; }

        /* Typography */
        .heading-1 {
            font-family: Arial, sans-serif;
            font-size: 24px;
            font-weight: bold;
            line-height: 1.3;
            margin: 0;
            padding: 0;
        }
        .heading-2 {
            font-family: Arial, sans-serif;
            font-size: 20px;
            font-weight: bold;
            line-height: 1.3;
            margin: 0;
            padding: 0;
        }
        .heading-3 {
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;
            line-height: 1.4;
            margin: 0;
            padding: 0;
        }
        .body-text {
            font-family: Arial, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            color: #424242;
        }
        .small-text {
            font-family: Arial, sans-serif;
            font-size: 12px;
            line-height: 1.5;
            color: #616161;
        }

        /* Links */
        a {
            color: #0072BC;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media only screen and (max-width: 600px) {
            .email-container {
                width: 100% !important;
            }
            .mobile-padding {
                padding: 10px !important;
            }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #F7F9F4;">
    <!-- Outer wrapper table for background -->
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #F7F9F4;">
        <tr>
            <td align="center" style="padding: 20px 0;">
                <!-- Main email container - 600px max width -->
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" class="email-container" style="background-color: #ffffff;">

                    <!-- Header Section -->
                    <tr>
                        <td>
                            {% include 'partials/header.html' %}
                        </td>
                    </tr>

                    <!-- Executive Summary Section -->
                    <tr>
                        <td style="padding: 20px 30px;">
                            {% include 'partials/summary.html' %}
                        </td>
                    </tr>

                    <!-- Category Sections -->
                    <tr>
                        <td style="padding: 0 30px 20px 30px;">
                            {% for category in categories %}
                                {% include 'partials/category.html' %}
                            {% endfor %}
                        </td>
                    </tr>

                    <!-- Footer Section -->
                    <tr>
                        <td>
                            {% include 'partials/footer.html' %}
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
