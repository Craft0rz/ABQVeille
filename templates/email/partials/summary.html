<!-- Executive Summary Section - ABQ Green & Blue palette -->
<table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
    <!-- AI Executive Summary (if available) -->
    {% if ai_executive_summary %}
    <tr>
        <td style="padding-bottom: 20px;">
            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #F5F9F0; border-left: 4px solid #8CC63F;">
                <tr>
                    <td style="padding: 15px;">
                        <h3 style="font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; color: #0072BC; margin: 0 0 10px 0; text-transform: uppercase;">
                            Resume du jour
                        </h3>
                        <p style="font-family: Arial, sans-serif; font-size: 14px; line-height: 1.6; color: #424242; margin: 0;">
                            {{ ai_executive_summary }}
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
    {% endif %}

    <!-- Statistics bar -->
    <tr>
        <td style="padding-bottom: 15px;">
            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                    <td style="font-family: Arial, sans-serif; font-size: 12px; color: #616161;">
                        <strong style="color: #0072BC;">{{ article_count }}</strong> articles | <strong style="color: #0072BC;">{{ source_count }}</strong> sources
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
