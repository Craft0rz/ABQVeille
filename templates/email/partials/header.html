<!-- Email Header with ABQ branding - Green & Blue palette -->
<table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
    <!-- Logo and Title Row -->
    <tr>
        <td style="background-color: #0072BC; padding: 20px 30px;">
            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                    <!-- ABQ Logo -->
                    <td valign="middle" style="width: 120px; padding-right: 20px;">
                        <img src="https://media.licdn.com/dms/image/v2/D4E0BAQHkXAAel_lrjQ/company-logo_200_200/company-logo_200_200/0/1734446383039/association_des_biologistes_du_qubec_logo?e=2147483647&v=beta&t=GzxlG5Dvk1nVVHVoRzUKaDDGrtds8aznjSCi6g4LkHI"
                             alt="ABQ"
                             width="100"
                             height="100"
                             style="display: block; border-radius: 8px; border: 3px solid #ffffff;">
                    </td>
                    <!-- ABQ Name -->
                    <td valign="middle">
                        <h1 style="font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; color: #ffffff; margin: 0; padding: 0;">
                            Association des Biologistes du Québec
                        </h1>
                        <p style="font-family: Arial, sans-serif; font-size: 12px; color: #A8D86B; margin: 5px 0 0 0;">
                            Depuis 1974 - Plus de 1000 membres
                        </p>
                    </td>
                    <!-- Title and date -->
                    <td valign="middle" align="right">
                        <h2 style="font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; color: #ffffff; margin: 0; padding: 0;">
                            Veille Scientifique
                        </h2>
                        <p style="font-family: Arial, sans-serif; font-size: 13px; color: #A8D86B; margin: 5px 0 0 0;">
                            {{ date | format_date('%d %B %Y') }}
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <!-- Green accent bar -->
    <tr>
        <td style="background-color: #8CC63F; height: 6px;"></td>
    </tr>
</table>
